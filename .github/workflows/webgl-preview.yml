name: WebGL Preview

on:
  push:
    paths:
      - '.github/workflows/webgl-preview.yml'
      - 'src/**'
      - 'webgl-next/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.webgl.config.ts'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/webgl-preview.yml'
      - 'src/**'
      - 'webgl-next/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.webgl.config.ts'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  fixture-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:webgl
      - name: Upload golden candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgl-golden-candidates-${{ github.sha }}
          path: |
            test-results/webgl-next/**/*.png
            test-results/webgl-next/**/*.json
          if-no-files-found: warn
          retention-days: 14
